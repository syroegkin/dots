# ZXPkg manifest for pkg.zx.in.net. The version line is stamped from ./VERSION
# by `make sync-version` (run on every build) edit VERSION, not this line.
[package]
name        = "number"
version     = "1.0.0"
type        = "dot"
description = "Convert numbers to their English-language equivalent."
author      = "syroegkin"
license     = "BSD-3-Clause"
homepage    = "https://github.com/syroegkin/dots"

[compat]
machine  = "next"
os       = ["nextzxos"]
needs    = []

[[artifact]]
src     = "number/build/NUMBER"
command = "NUMBER"
