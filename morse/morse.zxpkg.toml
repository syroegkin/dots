# ZXPkg manifest for pkg.zx.in.net. The version line is stamped from ./VERSION
# by `make sync-version` (run on every build) edit VERSION, not this line.
[package]
name        = "morse"
version     = "1.0.0"
type        = "dot"
description = "Bring Morse code to your ZX Spectrum Next."
author      = "syroegkin"
license     = "GPL-3.0"
homepage    = "https://github.com/syroegkin/dots"

[compat]
machine  = "next"
os       = ["nextzxos"]
needs    = []

[[artifact]]
src     = "morse/build/MORSE"
command = "MORSE"
